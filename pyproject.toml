[project]
name = "cairn"
version = "0.1.0"
description = "Transactional, provenance-stamped memory for agents that take actions."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pyyaml>=6.0",
]
mcp = [
    "mcp>=1.2",
]
aws = [
    "boto3>=1.35",
]

[project.scripts]
cairn-mcp = "cairn.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=120"
markers = [
    "slow: takes more than a few seconds",
]
